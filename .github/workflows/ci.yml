name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Cache sandbox assets
        uses: actions/cache@v6.1.0
        with:
          path: src/wwyd/sandbox/assets
          key: sandbox-assets-${{ hashFiles('scripts/build_sandbox.py', 'uv.lock') }}
      - name: Build sandbox assets (downloads the sha256-pinned upstream archive)
        run: |
          if [ ! -f src/wwyd/sandbox/assets/manifest.json ]; then
            uv run python -I scripts/build_sandbox.py
          fi
        shell: bash
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  sandbox:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Cache sandbox assets
        uses: actions/cache@v6.1.0
        with:
          path: src/wwyd/sandbox/assets
          key: sandbox-assets-${{ hashFiles('scripts/build_sandbox.py', 'uv.lock') }}
      - name: Build sandbox assets (downloads the sha256-pinned upstream archive)
        run: |
          if [ ! -f src/wwyd/sandbox/assets/manifest.json ]; then
            uv run python -I scripts/build_sandbox.py
          fi
        shell: bash
      - name: Sandbox assets must be present
        run: uv run python -c "import sys, wwyd.sandbox as s; sys.exit(not s.available())"
      - run: uv run pytest -q tests/test_sandbox*.py
        shell: bash
